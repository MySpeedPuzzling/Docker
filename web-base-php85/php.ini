variables_order = EGPCS

date.timezone = "UTC"

memory_limit = 512M
upload_max_filesize = 50M
post_max_size = 50M

; Increased for FrankenPHP worker mode - workers persist so longer timeout is safe.
; Prevents triggering worker starvation bug (github.com/dunglas/frankenphp/issues/2205)
max_execution_time = 120

; Reading the request body gets its own budget. At -1 (PHP's default) FrankenPHP
; starts the max_execution_time timer before it reads the body and never resets it
; in worker mode (frankenphp.c, frankenphp_handle_request), so a photo uploaded over
; a slow connection used up the whole 120 s and the request died with a 500 the
; moment the app started running - the submission lost (Sentry WEB-8Y, 290 events).
; Set, the body may take up to 300 s and the app still gets its full 120 s after it.
max_input_time = 300

realpath_cache_size = 16M
realpath_cache_ttl = 1800

; 30 days
session.gc_maxlifetime="2592000"

; 1 for dev (asserts execute), -1 for prod (asserts compiled out entirely)
zend.assertions = ${PHP_ZEND_ASSERTIONS}

[opcache]

opcache.enable=1
opcache.revalidate_freq=0
opcache.validate_timestamps=${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.max_accelerated_files=${PHP_OPCACHE_MAX_ACCELERATED_FILES}
opcache.memory_consumption=${PHP_OPCACHE_MEMORY_CONSUMPTION}
opcache.max_wasted_percentage=${PHP_OPCACHE_MAX_WASTED_PERCENTAGE}
opcache.interned_strings_buffer=16
